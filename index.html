<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BBPS & NTPC Gadarwara | Official AI Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .listening-pulse { animation: pulse-ring 1.5s infinite; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header with Official Logos -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <!-- Official Logos -->
        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg p-1 shadow-sm gap-1">
          <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/Bal_Bharati_Public_School_logo.png/220px-Bal_Bharati_Public_School_logo.png" alt="BBPS Logo" class="h-8 w-8 object-contain bg-white rounded-md">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/NTPC_Logo.svg/512px-NTPC_Logo.svg.png" alt="NTPC Logo" class="h-8 w-8 object-contain bg-white rounded-md p-0.5">
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm sm:text-base leading-tight">Gadarwara Digital Helpdesk</h1>
          <p class="text-xs text-slate-500">BBPS Campus & NTPC Super Thermal Power Station</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="tts-toggle" onclick="toggleAutoVoice()" class="text-xs font-medium px-3 py-1.5 rounded-full border transition flex items-center gap-1.5 bg-emerald-50 border-emerald-300 text-emerald-800">
          <span id="tts-icon">🔊</span><span id="tts-label">Voice Reply: ON</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-5">
    
    <!-- Portal Switcher -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
      <button id="tab-school" onclick="switchBot('school')" class="text-left p-4 rounded-xl border-2 transition-all bg-blue-50/70 border-blue-600 shadow-sm flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-600 text-white">School Helpdesk</span>
          </div>
          <h2 class="text-base font-bold text-slate-900 mt-1.5">Bal Bharati Public School</h2>
          <p class="text-xs text-slate-600 mt-0.5">Admissions, Academics, Sports & History</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/Bal_Bharati_Public_School_logo.png/220px-Bal_Bharati_Public_School_logo.png" class="h-12 w-12 object-contain opacity-90">
      </button>

      <button id="tab-ntpc" onclick="switchBot('ntpc')" class="text-left p-4 rounded-xl border-2 transition-all bg-white border-slate-200 hover:border-teal-600 flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-200 text-slate-700">Township & Plant</span>
          </div>
          <h2 class="text-base font-bold text-slate-900 mt-1.5">NTPC Gadarwara (1600 MW)</h2>
          <p class="text-xs text-slate-600 mt-0.5">Gate Pass, Capacity, Jobs & Environment</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/NTPC_Logo.svg/512px-NTPC_Logo.svg.png" class="h-12 w-12 object-contain opacity-90">
      </button>
    </div>

    <!-- Chat Interface -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[560px]">
      <div id="chat-header" class="bg-blue-700 text-white px-5 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center overflow-hidden p-0.5">
            <img id="bot-img" src="https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/Bal_Bharati_Public_School_logo.png/220px-Bal_Bharati_Public_School_logo.png" class="w-full h-full object-contain">
          </div>
          <div>
            <h3 id="bot-title" class="font-semibold text-sm">BBPS Information Desk</h3>
            <p id="bot-subtitle" class="text-xs text-blue-100">Direct School Data Integrated</p>
          </div>
        </div>
        <button onclick="clearChat()" class="text-xs bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded transition">Reset Chat</button>
      </div>

      <div id="chat-box" class="flex-1 p-5 overflow-y-auto chat-scroll space-y-4 bg-slate-50/50"></div>
      
      <!-- Quick Chips -->
      <div id="quick-chips" class="px-4 py-2.5 bg-white border-t border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar"></div>

      <!-- Input Form -->
      <form onsubmit="handleUserSubmit(event)" class="p-3 bg-white border-t border-slate-200 flex gap-2">
        <button type="button" id="mic-btn" onclick="startSingleVoice()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-1.5 text-xs font-medium shrink-0">
          <span id="mic-icon">🎤</span><span class="hidden sm:inline">Speak</span>
        </button>
        <input id="user-input" type="text" placeholder="Ask about Admissions, Academics, Results, Jobs, or any question..." class="flex-1 text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-600 focus:bg-white transition" required />
        <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition shadow-sm">Ask</button>
      </form>
    </div>
  </main>

  <script>
    // --- GEMINI API KEY INTEGRATED ---
    const GEMINI_API_KEY = "AQ.Ab8RN6JtJFU_wA4ZNmNCBO-XNrgDucqZgxQJt9k1YuZ_vyP22A"; 
    // -----------------------------------------

    let activeBot = 'school';
    let autoVoiceReply = true;
    let recognitionInstance = null;

    // Admission Form Email Sender (Direct to Gmail)
    function submitViaGmail(e) {
      e.preventDefault();
      const name = document.getElementById('studentName').value;
      const phone = document.getElementById('parentPhone').value;
      const grade = document.getElementById('applyClass').value;
      
      const subject = encodeURIComponent("New Admission Enquiry - BBPS Gadarwara");
      const body = encodeURIComponent(`Student Name: ${name}\nContact Phone: ${phone}\nApplying for Class: ${grade}\n\nSent from Gadarwara AI Helpdesk`);
      
      window.open(`mailto:nikhilpatel6105@gmail.com?subject=${subject}&body=${body}`, '_blank');
      e.target.reset();
      appendBotMessage("Thank you! Your email application has opened. Please hit 'Send' to complete the enquiry.", "System Confirmation");
    }

    // UPDATED KNOWLEDGE BASE: Providing full text data instead of just links
    const knowledgeBase = {
      school: {
        name: "BBPS Information Desk", subtitle: "Official CBSE School Information", headerClass: "bg-blue-700", btnClass: "bg-blue-600 hover:bg-blue-700", imgUrl: "https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/Bal_Bharati_Public_School_logo.png/220px-Bal_Bharati_Public_School_logo.png",
        welcome: "Welcome to the **BBPS Gadarwara Portal**. You can ask me detailed questions about our **Academics**, **Vision & Mission**, **Sports**, **Board Results**, or fill out the **Admission Form**.",
        chips: ["📝 Admission Form", "🏫 About Us & Vision", "📚 Academics & Results", "🏆 Sports & Activities", "📞 Contact Info"],
        entries: [
          // ADMISSIONS
          {
            phrases: ["fill admission form", "take admission", "apply online", "admission process", "entrance requirements", "scholarships"],
            keywords: ["admission", "admissions", "apply", "form", "enroll"],
            answer: `**Admissions Process & Online Form:**
Our admission process is transparent and merit-based. For Pre-Primary classes, selection is based on interaction. For Class I and above, a basic written entrance assessment is conducted based on seat availability. Both NTPC wards and local community students are welcome to apply.

**Quick Admission Enquiry:** Fill out this form to send your details directly to our administration.
<form onsubmit="submitViaGmail(event)" class="mt-3 space-y-2 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
  <input type="text" id="studentName" placeholder="Student Full Name" required class="w-full text-sm p-2 border border-slate-200 rounded-lg">
  <input type="tel" id="parentPhone" placeholder="Parent's Phone" required class="w-full text-sm p-2 border border-slate-200 rounded-lg">
  <select id="applyClass" required class="w-full text-sm p-2 border border-slate-200 rounded-lg bg-white">
    <option value="">-- Select Class --</option>
    <option value="Pre-Primary">Pre-Primary (Nursery/KG)</option>
    <option value="Primary (1-5)">Primary (Classes 1 - 5)</option>
    <option value="Middle (6-8)">Middle (Classes 6 - 8)</option>
    <option value="Secondary (9-12)">Secondary (9 - 12)</option>
  </select>
  <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-lg text-sm font-bold mt-1 shadow-sm">Send Enquiry</button>
</form>`,
            voiceText: "Our admission is merit-based. You can apply by filling out the online enquiry form provided in the chat. The details will be emailed directly to the administration.",
            aiRef: "BBPS Internal Data: Admissions"
          },
          // ABOUT US & HISTORY
          {
            phrases: ["about us", "school history", "vision", "mission", "core values", "president message", "leadership", "philosophy"],
            keywords: ["about", "history", "vision", "mission", "president", "faculty", "philosophy"],
            answer: `**About BBPS Gadarwara & Our Vision:**
• **Vision & Core Values:** Our motto is *"Hanso Nayatu Naha Pragyam"* (Lead Us Unto Light). We strive to build a community of lifelong learners, focusing on holistic development, character building, and national integration.
• **History & Legacy:** Built in collaboration with NTPC Gadarwara, our school operates under the esteemed **Child Education Society (CES), New Delhi**, which has a legacy of excellence in education across India.
• **Our Faculty:** We have a team of highly qualified, dedicated teachers who act as facilitators rather than just instructors, ensuring personalized care for every student.`,
            voiceText: "Bal Bharati Public School Gadarwara operates under the Child Education Society. Our motto is Lead Us Unto Light, and we focus on holistic development and character building.",
            aiRef: "BBPS Internal Data: About Us"
          },
          // ACADEMICS & RESULTS
          {
            phrases: ["academics", "curriculum", "teaching", "learning approach", "academic support", "career counseling", "academic calendar", "assessment policy", "board results"],
            keywords: ["academic", "curriculum", "calendar", "assessment", "result", "results", "teaching"],
            answer: `**Academics, Curriculum & Board Results:**
• **Curriculum Overview:** We are a CBSE-affiliated institution following the guidelines of NEP 2020. We focus on experiential learning, critical thinking, and smart-board enabled digital education.
• **Assessment Policy:** We follow a Continuous and Comprehensive Evaluation (CCE) pattern to ensure stress-free academic growth.
• **Board Results:** Our students consistently achieve **100% pass results** in CBSE Class 10 and 12 board exams, with many students securing top ranks in the Narsinghpur district.
• **Support:** We offer dedicated college and career counseling for senior students to help them prepare for competitive exams (JEE/NEET) and university admissions.`,
            voiceText: "We follow the CBSE curriculum based on NEP 2020. Our school consistently achieves 100 percent pass results in Class 10 and 12 board exams, and we provide dedicated career counseling.",
            aiRef: "BBPS Internal Data: Academics"
          },
          // BEYOND ACADEMICS & SPORTS
          {
            phrases: ["beyond academics", "co-curricular", "outward bound", "sports", "achievers", "circular"],
            keywords: ["sports", "co-curricular", "extracurricular", "achiever", "circular", "activities", "atl"],
            answer: `**Beyond Academics (Sports & Co-Curricular):**
• **Sports Facilities:** We strongly believe in physical education. Our campus includes dedicated grounds and courts for Football, Cricket, Basketball, Volleyball, and Athletics. 
• **Co-Curricular Activities:** We have an advanced **Atal Tinkering Lab (ATL)** for robotics and AI, along with vibrant Art, Music, and Dance rooms.
• **Outward Bound & Clubs:** Students actively participate in Eco Clubs, debate societies, and outward-bound educational trips to build leadership skills.
• **Achievers:** Our students regularly win medals at CBSE cluster sports meets and national-level cultural competitions.`,
            voiceText: "We provide excellent facilities for sports like basketball, football, and cricket. We also have an Atal Tinkering Lab for robotics, and our students regularly win at national competitions.",
            aiRef: "BBPS Internal Data: Beyond Academics"
          },
          // CONTACT & CAREERS
          {
            phrases: ["contact us", "contact details", "map", "enquiry", "parent portal login", "careers at our school", "jobs", "hiring"],
            keywords: ["contact", "map", "login", "portal", "career", "careers", "job", "jobs", "vacancy"],
            answer: `**Contact, Careers & Portals:**
• **Address:** Bal Bharati Public School, NTPC Gadarwara Township, PO Gangai, Dist. Narsinghpur (M.P.) - 487770.
• **Parent Portal:** Parents can log in to the official portal to check attendance, report cards, and fee status.
• **Careers at BBPS:** We regularly hire dynamic PGT/TGT teachers and staff. Vacancies are updated on our official website's career page.`,
            voiceText: "The school is located inside the NTPC Gadarwara Township in Narsinghpur district. We regularly hire qualified teaching staff, and parents can track student progress via the Parent Portal.",
            aiRef: "BBPS Internal Data: Contact"
          }
        ]
      },
      ntpc: {
        name: "NTPC Gadarwara Info Desk", subtitle: "1,600 MW Super Thermal Power Station", headerClass: "bg-teal-700", btnClass: "bg-teal-600 hover:bg-teal-700", imgUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/NTPC_Logo.svg/512px-NTPC_Logo.svg.png",
        welcome: "Welcome to **NTPC Gadarwara (1,600 MW)**. Ask about Job Options, Gate Passes, or Power Capacity.",
        chips: ["💼 NTPC Jobs", "🛂 Visitor Gate Pass", "⚡ Plant Capacity"],
        entries: [
          {
            phrases: ["ntpc jobs", "job options", "vacancy in ntpc", "recruitment", "hiring", "careers"], keywords: ["job", "jobs", "vacancy", "career", "careers", "recruitment"],
            answer: `**NTPC Careers & Recruitment:**\nPlant recruitment and job options are managed centrally by NTPC Limited. For current job vacancies, required qualifications, and official recruitment notices, you must visit the official NTPC careers portal at **careers.ntpc.co.in**.`,
            voiceText: "For job options and recruitment at NTPC, please visit the official NTPC careers portal.", aiRef: "NTPC Official Careers Policy"
          },
          { phrases: ["visitor gate pass", "cisf"], keywords: ["visitor", "visit", "gate", "pass", "cisf"], answer: `**NTPC Visitor Rules:**\nTownship Entry requires a valid Government ID at the CISF Main Gate. Entry into the actual Power Plant area requires a strictly authorized official Gate Pass and mandatory safety clearance.`, voiceText: "Visitors must present a valid Government ID at the CISF gate for township entry. Plant entry requires a strict safety gate pass.", aiRef: "NTPC Security Protocol" },
          { phrases: ["capacity", "mw", "power"], keywords: ["capacity", "mw", "power", "unit"], answer: `**NTPC Gadarwara Capacity:**\nThe total installed capacity of the plant is **1,600 MW**, comprising 2 units of 800 MW each using advanced supercritical boiler technology.`, voiceText: "NTPC Gadarwara has a total installed capacity of 1600 Megawatts across two supercritical units.", aiRef: "NTPC Plant Specs" }
        ]
      }
    };

    function switchBot(botKey) {
      activeBot = botKey;
      const data = knowledgeBase[botKey];
      document.getElementById('tab-school').className = `text-left p-4 rounded-xl border-2 transition-all flex items-start justify-between ${botKey === 'school' ? 'bg-blue-50/70 border-blue-600 shadow-sm' : 'bg-white border-slate-200 hover:border-blue-600'}`;
      document.getElementById('tab-ntpc').className = `text-left p-4 rounded-xl border-2 transition-all flex items-start justify-between ${botKey === 'ntpc' ? 'bg-teal-50/70 border-teal-600 shadow-sm' : 'bg-white border-slate-200 hover:border-teal-600'}`;
      document.getElementById('chat-header').className = `${data.headerClass} text-white px-5 py-3.5 flex items-center justify-between transition-colors`;
      document.getElementById('bot-img').src = data.imgUrl;
      document.getElementById('bot-title').textContent = data.name;
      document.getElementById('bot-subtitle').textContent = data.subtitle;
      document.getElementById('send-btn').className = `${data.btnClass} text-white text-sm font-medium px-5 py-2.5 rounded-xl transition shadow-sm`;
      
      document.getElementById('quick-chips').innerHTML = data.chips.map(chip => 
        `<button onclick="sendQuickQuery('${chip.replace(/[📝🏫📚🏆🖼️📞💼🛂⚡]/g, '').trim()}')" class="shrink-0 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-full transition whitespace-nowrap">${chip}</button>`
      ).join('');
      clearChat();
    }

    function clearChat() {
      document.getElementById('chat-box').innerHTML = '';
      appendBotMessage(knowledgeBase[activeBot].welcome, "System Ready • Direct Data Integrated", null, false);
    }

    function toggleAutoVoice() {
      autoVoiceReply = !autoVoiceReply;
      const btn = document.getElementById('tts-toggle');
      if (autoVoiceReply) {
        btn.className = "text-xs font-medium px-3 py-1.5 rounded-full border transition flex items-center gap-1.5 bg-emerald-50 border-emerald-300 text-emerald-800";
        document.getElementById('tts-icon').textContent = "🔊"; document.getElementById('tts-label').textContent = "Voice Reply: ON";
      } else {
        window.speechSynthesis.cancel();
        btn.className = "text-xs font-medium px-3 py-1.5 rounded-full border transition flex items-center gap-1.5 bg-slate-100 border-slate-300 text-slate-600";
        document.getElementById('tts-icon').textContent = "🔇"; document.getElementById('tts-label').textContent = "Voice Reply: OFF";
      }
    }

    function startSingleVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Voice recognition requires Chrome/Edge.");
      window.speechSynthesis.cancel();
      recognitionInstance = new SpeechRecognition();
      recognitionInstance.lang = 'en-IN';
      recognitionInstance.onstart = () => { document.getElementById('user-input').placeholder = "Listening..."; };
      recognitionInstance.onresult = (event) => { 
        document.getElementById('user-input').value = event.results[0][0].transcript; 
        handleUserSubmit(new Event('submit')); 
      };
      recognitionInstance.onend = () => { document.getElementById('user-input').placeholder = "Ask about Admissions, Academics, Jobs..."; };
      recognitionInstance.start();
    }

    function appendUserMessage(text) {
      document.getElementById('chat-box').innerHTML += `<div class="flex justify-end"><div class="bg-slate-800 text-white text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[80%] shadow-sm">${text}</div></div>`;
      document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }

    function appendBotMessage(text, aiRef, voiceSummary = null, shouldSpeak = true) {
      const chatBox = document.getElementById('chat-box');
      let formattedText = text;
      if (!text.includes("<form")) formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      chatBox.innerHTML += `<div class="flex justify-start"><div class="bg-white border border-slate-200 text-slate-800 text-sm p-4 rounded-2xl rounded-tl-sm max-w-[88%] shadow-sm space-y-2.5"><div class="leading-relaxed">${formattedText}</div><div class="pt-2 border-t border-slate-100 text-[11px] text-slate-400">✓ ${aiRef}</div></div></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      
      if (shouldSpeak && autoVoiceReply && 'speechSynthesis' in window) {
        let cleanText = (voiceSummary || text).replace(/<[^>]*>?/gm, '').replace(/\*\*(.*?)\*\*/g, '$1');
        let utterance = new SpeechSynthesisUtterance(cleanText);
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }
    }

    function sendQuickQuery(text) { document.getElementById('user-input').value = text; handleUserSubmit(new Event('submit')); }

    function scoreEntry(queryLower, entry) {
      let score = 0;
      if (entry.phrases) { for (const phrase of entry.phrases) { if (queryLower.includes(phrase)) score += 15; } }
      for (const kw of entry.keywords) { if (queryLower.includes(kw)) score += 3; }
      return score;
    }

    // --- GEMINI AI INTEGRATION ---
    async function fetchGeminiAI(query) {
      if (!GEMINI_API_KEY) return null;
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `You are an AI assistant for Bal Bharati Public School and NTPC Gadarwara. Answer the following question accurately and concisely in 2 or 3 short sentences. Do not use external links. Question: ${query}` }] }]
          })
        });
        
        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const aiText = data.candidates[0].content.parts[0].text;
          return { 
            answer: `**AI Assistant:**\n${aiText}`, 
            voiceText: aiText, 
            aiRef: "Powered by Google Gemini AI" 
          };
        }
      } catch (e) {
        console.error("Gemini AI Error:", e);
      }
      return null;
    }

    async function handleUserSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('user-input');
      const query = input.value.trim();
      if (!query) return;
      appendUserMessage(query);
      input.value = '';

      const qLower = query.toLowerCase();
      let bestMatch = null;
      let maxScore = 0;

      // 1. Check Local School/NTPC Database First (Highest Priority)
      for (const entry of knowledgeBase[activeBot].entries) {
        let score = scoreEntry(qLower, entry);
        if (score > maxScore) { maxScore = score; bestMatch = entry; }
      }
      
      // Check the other tab if no strong match
      if (maxScore < 3) {
        const otherBot = activeBot === 'school' ? 'ntpc' : 'school';
        for (const entry of knowledgeBase[otherBot].entries) {
          let score = scoreEntry(qLower, entry);
          if (score > maxScore) { maxScore = score; bestMatch = entry; bestMatch.aiRef = `Cross-Domain Routing (${otherBot.toUpperCase()}) • ${entry.aiRef}`; }
        }
      }

      // 2. If no local match is found, query Gemini AI
      if (maxScore < 3) {
        let geminiMatch = await fetchGeminiAI(query);
        if (geminiMatch) bestMatch = geminiMatch;
      }

      // 3. Fallback if Gemini isn't setup or fails
      if (maxScore < 3 && !bestMatch) {
        bestMatch = { 
          answer: `I couldn't find an exact match. Try asking about **Admissions**, **Gallery**, **Academics**, or **Jobs**.`, 
          aiRef: "NLP Fallback" 
        };
      }

      appendBotMessage(bestMatch.answer, bestMatch.aiRef, bestMatch.voiceText, true);
    }

    switchBot('school');
  </script>
</body>
</html>
