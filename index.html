    function startSingleVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Voice recognition requires Chrome/Edge.");
      window.speechSynthesis.cancel();
      recognitionInstance = new SpeechRecognition();
      recognitionInstance.lang = 'en-IN';
      recognitionInstance.onstart = () => { document.getElementById('user-input').placeholder = "Listening..."; };
      recognitionInstance.onresult = (event) => { 
        document.getElementById('user-input').value = event.results[0][0].transcript; 
        handleUserSubmit(new Event('submit')); 
      };
      recognitionInstance.onend = () => { document.getElementById('user-input').placeholder = "Ask about Admissions, Academics, Jobs..."; };
      recognitionInstance.start();
    }

    function appendUserMessage(text) {
      document.getElementById('chat-box').innerHTML += `<div class="flex justify-end"><div class="bg-slate-800 text-white text-sm px-4 py-2.5 rounded-2xl rounded-tr-sm max-w-[80%] shadow-sm">${text}</div></div>`;
      document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
    }

    function appendBotMessage(text, aiRef, voiceSummary = null, shouldSpeak = true) {
      const chatBox = document.getElementById('chat-box');
      let formattedText = text;
      if (!text.includes("<form")) formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      chatBox.innerHTML += `<div class="flex justify-start"><div class="bg-white border border-slate-200 text-slate-800 text-sm p-4 rounded-2xl rounded-tl-sm max-w-[88%] shadow-sm space-y-2.5"><div class="leading-relaxed">${formattedText}</div><div class="pt-2 border-t border-slate-100 text-[11px] text-slate-400">✓ ${aiRef}</div></div></div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      
      if (shouldSpeak && autoVoiceReply && 'speechSynthesis' in window) {
        let cleanText = (voiceSummary || text).replace(/<[^>]*>?/gm, '').replace(/\*\*(.*?)\*\*/g, '$1');
        let utterance = new SpeechSynthesisUtterance(cleanText);
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }
    }

    function sendQuickQuery(text) { document.getElementById('user-input').value = text; handleUserSubmit(new Event('submit')); }

    function scoreEntry(queryLower, entry) {
      let score = 0;
      if (entry.phrases) { for (const phrase of entry.phrases) { if (queryLower.includes(phrase)) score += 15; } }
      for (const kw of entry.keywords) { if (queryLower.includes(kw)) score += 3; }
      return score;
    }

    // --- GEMINI AI INTEGRATION ---
    async function fetchGeminiAI(query) {
      if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") return null;
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `You are an AI assistant for Bal Bharati Public School and NTPC Gadarwara. Answer the following question accurately and concisely in 2 or 3 short sentences. Question: ${query}` }] }]
          })
        });
        
        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const aiText = data.candidates[0].content.parts[0].text;
          return { 
            answer: `**AI Assistant:**\n${aiText}`, 
            voiceText: aiText, 
            aiRef: "Powered by Google Gemini AI" 
          };
        }
      } catch (e) {
        console.error("Gemini AI Error:", e);
      }
      return null;
    }

      const query = input.value.trim();
      if (!query) return;
      appendUserMessage(query);
      input.value = '';

      const qLower = query.toLowerCase();
      let bestMatch = null;
      let maxScore = 0;

      // 1. Check Local School/NTPC Database First (Highest Priority)
      for (const entry of knowledgeBase[activeBot].entries) {
        let score = scoreEntry(qLower, entry);
        if (score > maxScore) { maxScore = score; bestMatch = entry; }
      }
      
      // Check the other tab if no strong match
      if (maxScore < 3) {
        const otherBot = activeBot === 'school' ? 'ntpc' : 'school';
        for (const entry of knowledgeBase[otherBot].entries) {
          let score = scoreEntry(qLower, entry);
          if (score > maxScore) { maxScore = score; bestMatch = entry; bestMatch.aiRef = `Cross-Domain Routing (${otherBot.toUpperCase()}) • ${entry.aiRef}`; }
        }
      }

      // 2. If no local match is found, query Gemini AI
      if (maxScore < 3) {
        let geminiMatch = await fetchGeminiAI(query);
        if (geminiMatch) bestMatch = geminiMatch;
      }

      // 3. Fallback if Gemini isn't setup or fails
      if (maxScore < 3 && !bestMatch) {
        bestMatch = { 
          answer: `I couldn't find an exact match. Try asking about **Admissions**, **Gallery**, **Academics**, or **Jobs**.`, 
          aiRef: "NLP Fallback" 
        };
      }

      appendBotMessage(bestMatch.answer, bestMatch.aiRef, bestMatch.voiceText, true);
    }

    switchBot('school');
  </script>
</body>
</html>
